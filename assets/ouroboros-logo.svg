<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="OUROBOROS">
<title>OUROBOROS</title>
<!--
  Three regions partition one annulus. Each owns 120 degrees of the outer rim,
  then winds inward through 165 degrees to its apex on the inner rim. They tile
  the annulus exactly, so both circles are unbroken.

  THE PALETTE IS THE SIX STOPS BELOW AND NOTHING ELSE. To recolour a release,
  change these and only these; the geometry never moves.

  The three colours are the terminal's own, taken from the kitty config:
    #FFFD00  color11, bright yellow   hue 59.5
    #FFB000  "Amber CRT"              hue 41.4
    #FF5A00  bell_border_color        hue 21.2
  All three sit at 100% saturation AND at 50% lightness, so the ring is a pure
  hue rotation with no lightness sag; the hues are spaced about 19 degrees
  apart. That is what makes it read as saturated rather than washed. Any
  replacement palette should hold the same rule: equal lightness, equal
  saturation, evenly spaced hue. Mixing in a pale high-lightness tint is what
  makes a ring like this go drab.

  The stops chain end to start and the last returns to the first, so colour is
  continuous the whole way round and closes where it began.
-->
<defs>
  <linearGradient id="ouro-light" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#FFFD00"/>
    <stop offset="100%" stop-color="#FFB000"/>
  </linearGradient>
  <linearGradient id="ouro-mid" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#FFB000"/>
    <stop offset="100%" stop-color="#FF5A00"/>
  </linearGradient>
  <linearGradient id="ouro-dark" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#FF5A00"/>
    <stop offset="100%" stop-color="#FFFD00"/>
  </linearGradient>
</defs>
